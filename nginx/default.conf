# verwijzers.slaapkliniek.be, slaapstudie.be (NL) en etudedusommeil.be (FR) serveren dezelfde site.
# Op de twee drukwerkdomeinen gaat de root naar de taal van het domein; de overige varianten
# (www, .eu, .com) verwijzen met 301 naar het .be-domein van hun taal. Nginx Proxy Manager zet
# TLS af en geeft de Host-header door; de canonieke URL per taal staat in config/site.json.
map $host $start_taal {
    default               "";
    slaapstudie.be        nl;
    etudedusommeil.be     fr;
}

server {
    listen 80 default_server;
    server_name verwijzers.slaapkliniek.be slaapstudie.be etudedusommeil.be _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;      # relatieve Location: achter de proxy kent nginx het schema (https) niet

    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;

    # Drukwerk-URL's zonder taal (slaapstudie.be/aanvraag) krijgen de taal van het domein.
    location ~ "^/(aanvraag|consult)(/|$)" {
        if ($start_taal) { return 302 /$start_taal$request_uri; }
        return 302 /nl$request_uri;
    }

    location = / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        if ($start_taal) { return 302 /$start_taal/; }
        try_files /index.html =404;
    }

    # Het formulier: nooit cachen (gedeelde pc's in praktijken), zelfde beveiligingsheaders.
    location ~ "^/[a-z]{2}/aanvraag/" {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location /static/ { expires 1h; }
    location /vendor/ { expires 1d; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Access-logs bevatten alleen paden: er wordt niets verstuurd dat in een log kan belanden.
    access_log /var/log/nginx/access.log;
}

server {
    listen 80;
    server_name www.slaapstudie.be slaapstudie.eu www.slaapstudie.eu slaapstudie.com www.slaapstudie.com;
    server_tokens off;
    location ~ "^/(nl|fr|en|de)(/|$)" { return 301 https://slaapstudie.be$request_uri; }
    location / { return 301 https://slaapstudie.be/nl$request_uri; }
}

server {
    listen 80;
    server_name www.etudedusommeil.be etudedusommeil.eu www.etudedusommeil.eu etudedusommeil.com www.etudedusommeil.com;
    server_tokens off;
    location ~ "^/(nl|fr|en|de)(/|$)" { return 301 https://etudedusommeil.be$request_uri; }
    location / { return 301 https://etudedusommeil.be/fr$request_uri; }
}
