server {
    listen 80 default_server;
    server_name verwijzers.slaapkliniek.be _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;

    # Het formulier: nooit cachen (gedeelde pc's in praktijken), zelfde beveiligingsheaders.
    location ~ "^/[a-z]{2}/aanvraag/" {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location /static/ { expires 1h; }
    location /vendor/ { expires 1d; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Access-logs bevatten alleen paden: er wordt niets verstuurd dat in een log kan belanden.
    access_log /var/log/nginx/access.log;
}

# ── Aliasdomeinen → 301 naar het canonieke portaal, met de taal van het domein ──────────────
# slaapstudie.{be,eu,com} → /nl/, etudedusommeil.{be,eu,com} → /fr/. NPM zet TLS af en stuurt
# de Host-header door; dit blok kiest op die Host. Een pad dat al een taal draagt blijft staan.
map $host $alias_lang {
    default                 nl;
    ~*etudedusommeil\.      fr;
}

server {
    listen 80;
    server_name slaapstudie.be www.slaapstudie.be slaapstudie.eu www.slaapstudie.eu slaapstudie.com www.slaapstudie.com
                etudedusommeil.be www.etudedusommeil.be etudedusommeil.eu www.etudedusommeil.eu etudedusommeil.com www.etudedusommeil.com;
    server_tokens off;
    include /etc/nginx/conf.d/security-headers.inc;

    location ~ "^/(nl|fr|en|de)(/|$)" { return 301 https://verwijzers.slaapkliniek.be$request_uri; }
    location / { return 301 https://verwijzers.slaapkliniek.be/$alias_lang$request_uri; }
}
