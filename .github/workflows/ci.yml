name: build en tests
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install "jinja2>=3.1" pytest mini-racer
      - run: python build.py
      - run: pytest -q
      - run: node tests/test_scores.js
      - name: docker-image bouwt
        run: docker build -t slaapkliniek-verwijzers:ci .
      - name: nginx-config is geldig in het image
        run: docker run --rm slaapkliniek-verwijzers:ci nginx -t
